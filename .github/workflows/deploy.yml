name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

# Varsayılan olarak hiçbir izin yok; her iş yalnızca gerekeni alır.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # CSP bu adrese kilitlenir. Özel alan adı kullanılıyorsa repo değişkeni SITE_URL ile verilir.
      VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      # Sürümler değişebilen etiketle değil sabit commit ile çağrılır: ele geçirilen bir etiket siteye kod sokamaz.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      # Paket kurulum betikleri çalışmaz: ele geçirilen bir bağımlılık kurulurken kod çalıştıramaz.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
